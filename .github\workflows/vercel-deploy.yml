# -----------------------------------------------
# Vercel (Next.js) — automaatne deploy GitHubi push-ilist
# Asenda oma GitHubi pawnsisse (deploy.yml staatiline GitHub Pages).
#
# Salajasid vaja GitHubi Settings → Secrets and variables → Actions:
#   VERCEL_TOKEN    — token https://vercel.com/account/tokens
#   VERCEL_ORG_ID   — organisatsiooni ID (vercel whoami näitab oma)
#   VERCEL_PROJECT_ID — projekti ID (vercel link'ni ja vercel pull)
#
# See töövoo ehitab Next.js-i ja laadib Vercel-i (serverless /api/*/ käib).
# -----------------------------------------------
name: Deploy to Vercel

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
